name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check + tsc)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit + API tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end + accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase (migrations applied from supabase/migrations)
        run: npx supabase start -x studio,imgproxy

      - name: plpgsql lint + Security/Performance Advisors
        run: npm run db:lint

      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local > /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts

      - name: Database tests (seats, concurrency, RLS, storage)
        run: npm run test:db
